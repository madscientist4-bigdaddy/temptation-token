[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "paris"
fs_permissions = [{ access = "read", path = "./" }]
# Pinned, consistent OpenZeppelin 4.9.6 (core + upgradeable) vendored under
# vendor/ — the shared repo lib/ mixes 4.9.6-upgradeable with 5.6.1-core, which
# breaks flatten/Slither. This is the exact dependency set used for deploy+verify.
remappings = [
  "@openzeppelin/contracts-upgradeable/=vendor/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=vendor/openzeppelin-contracts/contracts/",
  "forge-std/=../lib/forge-std/src/"
]

# Invariant / fuzz depth for the safety suite (Gate B)
[profile.default.invariant]
runs = 256
depth = 128
fail_on_revert = false

[profile.default.fuzz]
runs = 512
