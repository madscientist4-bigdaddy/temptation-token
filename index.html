<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <!-- viewport-fit=cover lets the installed app paint under the notch/home indicator;
         the CSS uses env(safe-area-inset-*) so nothing important lands underneath. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Temptation Token — weekly onchain fan voting on Base</title>
    <!-- Copy rule: true, current facts only. No token price, no dollar figure, no
         earnings promise, and no audit claim until an audit exists. Rationale and the
         full retraction list: outputs/site/false_claims_2026-09-25.md (not shipped).
         The 35/35/10/20 split is hardcoded in V3d and CI-guarded, so it stays. -->
    <meta name="description" content="A weekly fan-voting game on Base. Fans vote for creator profiles with $TTS; each round closes on a fixed weekly schedule, picks a winner with Chainlink VRF, and mints Trophy NFTs onchain. Split: 35% top voter, 35% winning profile, 10% charity, 20% house." />
    <meta name="keywords" content="temptation token, TTS, Base blockchain, onchain voting, creator voting, NFT trophy, Chainlink VRF" />
    <meta name="author" content="Blockchain Entertainment LLC" />
    <link rel="canonical" href="https://app.temptationtoken.io/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.temptationtoken.io/" />
    <meta property="og:title" content="Temptation Token — weekly onchain fan voting on Base" />
    <meta property="og:description" content="Fans vote for creator profiles with $TTS. Every round settles onchain with Chainlink VRF and mints Trophy NFTs. 35/35/10/20 split, hardcoded in the contract." />
    <meta property="og:image" content="https://app.temptationtoken.io/og-image.png" />
    <meta property="og:site_name" content="Temptation Token" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TemptationToken" />
    <meta name="twitter:title" content="Temptation Token — weekly onchain fan voting on Base" />
    <meta name="twitter:description" content="Fans vote for creator profiles with $TTS. Every round settles onchain with Chainlink VRF and mints Trophy NFTs." />
    <meta name="twitter:image" content="https://app.temptationtoken.io/og-image.png" />

    <!-- JSON-LD. SoftwareApplication (not WebApplication) is what Part 1.4 asks for and
         what Google documents for app rich results; operatingSystem names both surfaces
         we actually ship. No aggregateRating: we have no reviews, and inventing one is
         a manual action waiting to happen. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Temptation Token",
      "url": "https://app.temptationtoken.io/",
      "description": "A weekly fan-voting game on Base. Fans vote for creator profiles with $TTS; each round settles onchain with Chainlink VRF and mints Trophy NFTs.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web, Android",
      "browserRequirements": "Requires JavaScript and a Base-compatible wallet",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "publisher": {
        "@type": "Organization",
        "name": "Blockchain Entertainment LLC",
        "url": "https://temptationtoken.io",
        "email": "jim@temptationtoken.io"
      }
    }
    </script>

    <!-- ── PWA / installability ────────────────────────────────────────────────
         Manifest drives the Android install prompt and the installed app's name,
         icons, colours and shortcuts. The apple-* tags are iOS's older equivalent:
         Safari ignores the manifest for standalone display and startup images. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05050a" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Temptation Token" />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Temptation" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />

    <!-- iOS startup images (portrait). Device-specific; anything unmatched falls back
         to the manifest/background colour rather than a white flash. -->
    <link rel="apple-touch-startup-image" href="/pwa/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
