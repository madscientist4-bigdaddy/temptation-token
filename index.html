<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <!-- viewport-fit=cover lets the installed app paint under the notch/home indicator;
         the CSS uses env(safe-area-inset-*) so nothing important lands underneath. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Temptation Token — Vote. Win. Earn $TTS.</title>
    <meta name="description" content="The first vote-to-earn game on Base blockchain. Vote $TTS on weekly profiles — top voter wins 35% of the prize pool. Audited by Solidproof. LP locked. Chainlink VRF." />
    <meta name="keywords" content="temptation token, TTS, vote to earn, Base blockchain, crypto game, DeFi, NFT, staking" />
    <meta name="author" content="Blockchain Entertainment LLC" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.temptationtoken.io" />
    <meta property="og:title" content="Temptation Token — Vote. Win. Earn $TTS." />
    <meta property="og:description" content="The first vote-to-earn game on Base blockchain. Vote $TTS on weekly profiles — top voter wins 35% of the prize pool (35/35/10/20 split). Audited by Solidproof. LP locked. Chainlink VRF." />
    <meta property="og:image" content="https://app.temptationtoken.io/og-image.png" />
    <meta property="og:site_name" content="Temptation Token" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TemptationToken" />
    <meta name="twitter:title" content="Temptation Token — Vote. Win. Earn $TTS." />
    <meta name="twitter:description" content="The first vote-to-earn game on Base blockchain. Vote $TTS on weekly profiles — top voter wins 35% of the prize pool (35/35/10/20 split)." />
    <meta name="twitter:image" content="https://app.temptationtoken.io/og-image.png" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Temptation Token",
      "url": "https://app.temptationtoken.io",
      "description": "The first vote-to-earn game on Base blockchain. Vote $TTS on weekly profiles — top voter wins 35% of the prize pool (35/35/10/20 split).",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "publisher": {
        "@type": "Organization",
        "name": "Blockchain Entertainment LLC",
        "url": "https://temptationtoken.io"
      }
    }
    </script>


    <!-- ── PWA / installability ────────────────────────────────────────────────
         Manifest drives the Android install prompt and the installed app's name,
         icons, colours and shortcuts. The apple-* tags are iOS's older equivalent:
         Safari ignores the manifest for standalone display and startup images. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05050a" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Temptation Token" />

    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Temptation" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png" />

    <!-- iOS startup images (portrait). Device-specific; anything unmatched falls back
         to the manifest/background colour rather than a white flash. -->
    <link rel="apple-touch-startup-image" href="/pwa/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <link rel="apple-touch-startup-image" href="/pwa/splash-1536x2048.png" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/pwa/splash-1668x2388.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
